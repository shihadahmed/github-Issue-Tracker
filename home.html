<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker | Home</title>
    <link
      rel="shortcut icon"
      href=".\assets\github-logo.png"
      type="image/png"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-[#F8FAFC] min-h-screen">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-4 py-3 md:h-16 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <div class="flex items-center justify-center md:justify-start gap-2 w-full md:w-auto">
          <i class="fa-brands fa-github text-3xl text-slate-800"></i>
          <h1 class="text-lg font-extrabold text-[#1F2937] tracking-tighter">
            GitHub Issues Tracker
          </h1>
        </div>

        <div class="flex items-center justify-center w-full md:w-auto gap-2">
          
          <div class="relative flex items-center w-full md:w-auto">
            <span class="absolute left-3 text-slate-400 text-sm z-10">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input
              type="text"
              id="searchInput"
              placeholder="Search issues..."
              class="input input-bordered w-full md:w-64 input-sm pl-9 focus:outline-none focus:border-primary"
            />
          </div>

          <button class="btn btn-primary btn-sm text-white px-5 shrink-0">+ New</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
      <div
        class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100 mb-6"
      >
        <div
          class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"
        >
          <div
            class="join bg-gray-100 border border-gray-200 p-1 w-full sm:w-auto"
          >
            <button
              class="btn btn-sm join-item btn-ghost flex-1 sm:px-6 active-tab"
            >
              All
            </button>
            <button class="btn btn-sm join-item btn-ghost flex-1 sm:px-6">
              Open
            </button>
            <button class="btn btn-sm join-item btn-ghost flex-1 sm:px-6">
              Closed
            </button>
          </div>

          <div
            class="flex items-center gap-4 text-[12px] font-bold self-center"
          >
            <span class="flex items-center gap-1.5"
              ><span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span id="openCount">0 Open</span></span
            >
            <span class="flex items-center gap-1.5"
              ><span class="w-2 h-2 rounded-full bg-indigo-500"></span>
              <span id="closedCount">0 Closed</span></span
            >
          </div>
        </div>

        <div class="mt-5 flex items-center gap-3 border-t border-gray-50 pt-5">
          <div
            class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 shrink-0"
          >
            <i class="fa-solid fa-circle-nodes text-xl"></i>
          </div>
          <div>
            <h2
              class="text-lg font-black text-slate-800 leading-none"
              id="totalCountDisplay"
            >
              0 Issues
            </h2>
            <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">
              Track and manage your project issues
            </p>
          </div>
        </div>
      </div>

      <div
        id="issuesGrid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6"
      ></div>
    </main>

    <dialog id="issueModal" class="modal">
      <div class="modal-box max-w-2xl p-8 rounded-3xl">
        <div id="modalContent"></div>
        <div class="modal-action">
          <form method="dialog">
            <button class="btn btn-primary px-8 rounded-xl bg-indigo-600">
              Close
            </button>
          </form>
        </div>
      </div>
    </dialog>

    <script src="./script/home.js"></script>
  </body>
</html>
