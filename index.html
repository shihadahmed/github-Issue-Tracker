<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker | Sign In</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="bg-base-200 min-h-screen flex items-center justify-center p-5">
        <div class="card w-full max-w-[480px] bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-8 md:p-12 text-center">
            
            <div class="flex justify-center mb-4 text-6xl text-slate-900">
                <i class="fa-brands fa-github"></i>
            </div>

            <h2 class="text-2xl font-bold text-slate-800 mb-1">GitHub Issues Tracker</h2>
            <p class="text-slate-400 text-sm font-medium mb-8">Sign in to manage your issues</p>

            <form id="loginForm" class="text-left space-y-4">
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-bold text-slate-700">Username</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" placeholder="Enter Username" required 
                            class="input input-bordered w-full pl-10 focus:input-primary transition-all" />
                    </div>
                    <label class="label">
                        <span class="label-text-alt text-primary font-bold">DEFAULT: admin</span>
                    </label>
                </div>

                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-bold text-slate-700">Password</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" placeholder="Enter Password" required 
                            class="input input-bordered w-full pl-10 focus:input-primary transition-all" />
                    </div>
                    <label class="label">
                        <span class="label-text-alt text-primary font-bold">DEFAULT: admin123</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-full text-white font-bold no-animation">
                    Sign In
                </button>
            </form>

            <div class="divider text-[10px] text-slate-300 font-bold uppercase tracking-widest my-8">OR</div>

            <div class="bg-base-200 p-6 rounded-2xl border border-base-300 text-left">
                <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-3">Demo Credentials:</p>
                <div class="space-y-1 text-[13px]">
                    <p class="text-slate-600 font-medium"><i class="fa-solid fa-circle-user mr-2 opacity-50"></i><strong>Username:</strong> admin</p>
                    <p class="text-slate-600 font-medium"><i class="fa-solid fa-key mr-2 opacity-50"></i><strong>Password:</strong> admin123</p>
                </div>
            </div>

        </div>
    </div>
    </div>
    
    
    <script src="./script/index.js"></script>
</body>
</html>
