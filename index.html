<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker | Sign In</title>
    <link rel="shortcut icon" href=".\assets\github-logo.png" type="image/png">

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-base-200 min-h-screen flex items-center justify-center p-5">
      <div
        class="card w-full max-w-[480px] bg-base-100 shadow-xl border border-base-300"
      >
        <div class="card-body p-8 md:p-12 text-center">
          <div class="flex justify-center mb-2 text-8xl text-[#1F2937]">
            <i class="fa-brands fa-github"></i>
          </div>

          <h2 class="text-2xl font-semibold text-[#1F2937] mb-0">
            GitHub Issues Tracker
          </h2>
          <p class="text-[#64748B] text-sm font-medium mt-0">
            Sign in to manage your issues
          </p>

          <form id="loginForm" class="text-left space-y-4">
            <div class="form-control w-full">
              <label class="label">
                <span class="label-text font-bold text-[#1F2937] mb-2"
                  >Username</span
                >
              </label>
              <div class="relative flex items-center">
                <span
                  class="absolute left-3 flex items-center justify-center text-[#64748B] z-10"
                >
                  <i class="fa-solid fa-user"></i>
                </span>
                <input
                  type="text"
                  id="username"
                  placeholder="Enter Username"
                  required
                  class="input input-bordered w-full pl-10 focus:outline-none focus:input-primary transition-all"
                />
              </div>

              <label class="label">
                <span class="label-text-alt text-[#4A00FF] font-normal mt-1.5"
                  >Default: admin</span
                >
              </label>
            </div>

            <div class="form-control w-full">
              <label class="label">
                <span class="label-text font-bold text-[#1F2937] mb-2"
                  >Password</span
                >
              </label>
              <div class="relative flex items-center">
                <span
                  class="absolute left-3 flex items-center justify-center text-[#64748B] z-10"
                >
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input
                  type="password"
                  id="password"
                  placeholder="Enter Password"
                  required
                  class="input input-bordered w-full pl-10 focus:outline-none focus:input-primary transition-all"
                />
              </div>
              <label class="label">
                <span class="label-text-alt text-[#4A00FF] font-normal mt-1.5"
                  >Default: admin123</span
                >
              </label>
            </div>

            <!-- <button type="submit" class="btn btn-primary w-full text-white font-bold no-animation">
                    Sign In
                </button> -->
            <button
              type="submit"
              class="btn btn-primary w-full text-white font-bold no-animation"
            >
              Sign In
            </button>

            <p
              id="error-message"
              class="text-error text-xs text-red-500 font-bold mt-2 text-center hidden"
            ></p>
          </form>

          <div
            class="divider text-[10px] text-[#64748B] font-bold uppercase tracking-widest my-3"
          >
            OR
          </div>

          <div
            class="bg-base-200 p-6 rounded-2xl border border-base-300 text-left"
          >
            <p
              class="text-[10px] text-[#64748B] font-black uppercase tracking-widest mb-3"
            >
              Demo Credentials:
            </p>
            <div class="space-y-1 text-[13px]">
              <p class="text-[#1F2937] font-medium">
                <i class="fa-solid fa-circle-user mr-2 opacity-50"></i
                ><strong>Username:</strong> admin
              </p>
              <p class="text-[#1F2937] font-medium">
                <i class="fa-solid fa-key mr-2 opacity-50"></i
                ><strong>Password:</strong> admin123
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./script/app.js"></script>
  </body>
</html>
